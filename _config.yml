# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you: 
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

repository: nathanogunleye/nathanogunleye.github.io

title: Nathan Ogunleye
subtitle: "My website"
name: &name "Nathan Ogunleye" 
email: nathanodong@gmail.com
description: &description "Nathan Ogunleye's Website"
baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site, e.g. http://example.com
twitter_username: NathanOgunleye
github_username:  nathanogunleye

# Conversion
markdown: kramdown
# no auto heading ids — they collide with the theme's #about/#contact/#projects tab styles
kramdown:
  auto_ids: false
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Site Author
author:
  name             : *name # *name is a YAML reference pointing to the &anchor earlier
  avatar           : "/assets/images/main/nathan_ogunleye.jpg"
  bio              : "Sitting behind a computer somewhere..."
  location         : "London, UK"
  links:
    - label: "Flickr"
      icon: "fab fa-fw fa-flickr"
      url: "https://www.flickr.com/photos/125738580@N07/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/nathanogunleye"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/nathanogunleye"
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://twitter.com/NathanOgunleye"

# Build settings
# No theme — custom layouts live in _layouts/, plain CSS in assets/css/
# (theme based on https://github.com/imfunniee/fimbo)

# Exclude from processing.
exclude:
  - Makefile
  - README.md
  - vendor/
